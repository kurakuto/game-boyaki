<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ｜ぼやきログ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0d0d10; --bg2:#13131a; --bg3:#1a1a24;
      --border:#252535; --border2:#303048;
      --accent:#7c6aff; --accent2:#a594ff;
      --text:#ddd8f0; --muted:#7a7a9a; --faint:#44445a; --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-weight:300; line-height:1.9; }
    a { color:var(--accent2); text-decoration:none; }
    a:hover { text-decoration:underline; }

    header { background:var(--bg2); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
    .hi { max-width:700px; margin:0 auto; padding:0 1.5rem; display:flex; align-items:center; justify-content:space-between; height:56px; }
    .lw { display:flex; align-items:center; gap:.7rem; }
    .li { width:32px; height:32px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; }
    .lt { font-family:'Share Tech Mono',monospace; font-size:1rem; color:#fff; }
    .ls { font-size:.58rem; color:var(--muted); font-family:'Share Tech Mono',monospace; }
    nav a { font-size:.72rem; color:var(--muted); padding:.35rem .7rem; border:1px solid transparent; transition:all .18s; }
    nav a:hover { color:var(--accent2); border-color:var(--border2); background:var(--bg3); }

    .wrap { max-width:700px; margin:0 auto; padding:3rem 1.5rem 5rem; }
    .page-label { font-family:'Share Tech Mono',monospace; font-size:.65rem; letter-spacing:.25em; color:var(--accent); text-transform:uppercase; margin-bottom:1rem; }
    h1 { font-family:'Noto Serif JP',serif; font-size:2rem; font-weight:700; color:#fff; margin-bottom:.5rem; }
    .sub { font-size:.88rem; color:var(--muted); margin-bottom:2.5rem; }

    .form-group { margin-bottom:1.5rem; }
    label { display:block; font-size:.8rem; color:var(--accent2); font-family:'Share Tech Mono',monospace; letter-spacing:.1em; margin-bottom:.5rem; }
    input, textarea {
      width:100%; padding:.8rem 1rem;
      background:var(--bg2); border:1px solid var(--border2);
      color:var(--text); font-family:'Noto Sans JP',sans-serif;
      font-size:.9rem; font-weight:300;
      outline:none; transition:border-color .2s;
      border-radius:0;
    }
    input:focus, textarea:focus { border-color:var(--accent); }
    textarea { resize:vertical; min-height:160px; }
    input::placeholder, textarea::placeholder { color:var(--faint); }

    .submit-btn {
      display:block; width:100%;
      padding:.9rem;
      background:var(--accent); color:#fff;
      border:none; font-family:'Noto Sans JP',sans-serif;
      font-size:.88rem; font-weight:500;
      letter-spacing:.1em; cursor:pointer;
      transition:background .2s;
    }
    .submit-btn:hover { background:var(--accent2); color:#111; }

    .note { font-size:.78rem; color:var(--faint); margin-top:1.5rem; line-height:1.7; }

    footer { background:var(--bg2); border-top:1px solid var(--border); padding:2rem 0; text-align:center; }
    .fl { font-family:'Share Tech Mono',monospace; font-size:1rem; color:var(--accent2); margin-bottom:.4rem; }
    .fls { display:flex; justify-content:center; gap:1.5rem; margin-bottom:1rem; }
    .fls a { font-size:.72rem; color:var(--faint); }
    .fls a:hover { color:var(--accent2); }
    .fc { font-family:'Share Tech Mono',monospace; font-size:.6rem; color:var(--faint); }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3824529215055359" crossorigin="anonymous"></script>
</head>
<body>

<header>
  <div class="hi">
    <a href="index.html" style="text-decoration:none">
      <div class="lw">
        <div class="li">🎮</div>
        <div><div class="lt">ぼやきログ</div><div class="ls">// BOYAKI_LOG.exe</div></div>
      </div>
    </a>
    <nav>
      <a href="index.html">TOP</a>
      <a href="privacy.html">プライバシーポリシー</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="page-label">// CONTACT</div>
  <h1>お問い合わせ</h1>
  <p class="sub">ご質問・ご意見・ご指摘などは以下のフォームからお気軽にどうぞ。<br>記事の内容に関するご指摘も歓迎です。</p>

  <form action="https://formspree.io/f/XXXXXXXX" method="POST">
    <!-- ↑ Formspree登録後、XXXXXXXX を自分のフォームIDに変える -->

    <div class="form-group">
      <label for="name">// お名前 *</label>
      <input type="text" id="name" name="name" placeholder="山田 太郎" required>
    </div>

    <div class="form-group">
      <label for="email">// メールアドレス *</label>
      <input type="email" id="email" name="email" placeholder="example@email.com" required>
    </div>

    <div class="form-group">
      <label for="subject">// 件名 *</label>
      <input type="text" id="subject" name="subject" placeholder="お問い合わせの件名" required>
    </div>

    <div class="form-group">
      <label for="message">// メッセージ *</label>
      <textarea id="message" name="message" placeholder="お問い合わせ内容をご記入ください..." required></textarea>
    </div>

    <button type="submit" class="submit-btn">送信する →</button>
  </form>

  <p class="note">
    ※ 返信まで数日かかる場合があります。<br>
    ※ スパム・営業目的のお問い合わせにはお返事できません。<br>
    ※ 送信された情報は、お問い合わせへの返答以外の目的には使用しません。
  </p>
</div>

<footer>
  <div class="wrap">
    <div class="fl">ぼやきログ // BOYAKI_LOG</div>
    <div class="fls">
      <a href="index.html">TOP</a>
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="contact.html">お問い合わせ</a>
    </div>
    <div class="fc">© 2026 ぼやきログ — All rights reserved.</div>
  </div>
</footer>

</body>
</html>
